manifest_path = "Cargo.toml"
third_party_dir = "."
precise_srcs = true
vendor = false

[buck]
buildscript_genrule = "tidepool_buildscript_run"
buckfile_imports = """
load(\"//build/rust:buildscript.bzl\", \"tidepool_buildscript_run\")
load(\"//build/rust:profiles.bzl\", rust_library = \"dependency_rust_library\", rust_binary = \"dependency_rust_binary\")
"""
