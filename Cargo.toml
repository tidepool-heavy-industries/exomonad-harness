[workspace]
members = ["crates/harness", "crates/harness-demo"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
fs2 = "0.4"
getrandom = "0.3"
jsonwebtoken = { version = "9", default-features = false }
libc = "0.2"
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }
blake3 = "1"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "blocking"], default-features = false }
roxmltree = "0.21.1"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "process", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
proptest = "1.11.0"
